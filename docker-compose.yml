version: "3.9"

# =============================================================================
# Projet Sentinel — Docker Compose (Jalon 1)
# Compatible Docker Engine / XPEnology NAS
# Démarrage : docker compose up -d --build
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Neo4j — Base de données orientée graphe
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.21-community
    container_name: sentinel_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "256m"
      NEO4J_dbms_memory_heap_max__size: "512m"
      NEO4J_dbms_memory_pagecache_size: "256m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    networks:
      - sentinel_net

  # ---------------------------------------------------------------------------
  # Backend — FastAPI Python 3.11
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
    depends_on:
      - neo4j
    expose:
      - "8000"
    networks:
      - sentinel_net

  # ---------------------------------------------------------------------------
  # Discord Bot Worker — Agent Brad (Exécution 24/7)
  # ---------------------------------------------------------------------------
  discord_bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_discord_bot
    restart: unless-stopped
    command: python -m app.workers.discord_bot
    env_file:
      - .env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
    depends_on:
      - neo4j
      - backend
    networks:
      - sentinel_net


  # ---------------------------------------------------------------------------
  # Frontend — React/Vite buildé, servi par Nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - sentinel_net

  # ---------------------------------------------------------------------------
  # Nginx — Reverse proxy & serveur de fichiers statiques
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: sentinel_nginx
    restart: unless-stopped
    ports:
      - "9080:80"   # Accès principal : http://<NAS_IP>:9080
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - sentinel_net

# =============================================================================
# Volumes persistants
# =============================================================================
volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_plugins:
    driver: local

# =============================================================================
# Réseau interne Docker
# =============================================================================
networks:
  sentinel_net:
    driver: bridge
